name: Coverage

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage and badge
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run coverage
        run: ./scripts/coverage --check

      # The badge is committed; verify it numerically rather than by byte
      # diff — llvm-cov's counts drift fractionally across toolchains, so an
      # exact-match check flakes on version skew. One point of drift fails.
      - name: Verify coverage badge is current
        run: ./scripts/coverage --verify-badge
